[versions]
protocol-connection = "3.0.0.Beta14-20261019.150006-9"
protocol-common = "3.0.0.Beta14-20261019.150006-9"
protocol-codec = "3.0.0.Beta14-20261019.150006-9"
geyser = "072bc064"
java-websocket = "1.6.0"
methanol = "1.9.0"
minecraftauth = "5.0.2"
gson = "2.14.0"
sqlite = "3.53.4.0"
configurate = "4.2.0-GeyserMC-20251111.004649-11"
configurate-core = "4.2.0-GeyserMC-20251111.004649-12"

shadow = "9.6.1"
indra = "4.1.0"
blossom = "2.2.0"

[libraries]
protocol-common = { group = "org.cloudburstmc.protocol", name = "common", version.ref = "protocol-common" }
protocol-codec = { group = "org.cloudburstmc.protocol", name = "bedrock-codec", version.ref = "protocol-codec" }
protocol-connection = { group = "org.cloudburstmc.protocol", name = "bedrock-connection", version.ref = "protocol-connection" }

geyser-api = { group = "com.github.SendableMetatype.EduGeyser", name = "api", version.ref = "geyser" }
geyser-core = { group = "com.github.SendableMetatype.EduGeyser", name = "core", version.ref = "geyser" }

gson = { group = "com.google.code.gson", name = "gson", version.ref = "gson"}

configurate-core = { module = "org.spongepowered:configurate-core", version.ref = "configurate-core" }
configurate-interface-ap = { module = "org.spongepowered:configurate-extra-interface-ap", version.ref = "configurate" }
configurate-interface = { module = "org.spongepowered:configurate-extra-interface", version.ref = "configurate" }
configurate-yaml = { module = "org.spongepowered:configurate-yaml", version.ref = "configurate" }

java-websocket = { group = "org.java-websocket", name = "Java-WebSocket", version.ref = "java-websocket" }

# Plugins
shadow = { group = "com.gradleup.shadow", name = "shadow-gradle-plugin", version.ref = "shadow" }
indra-git = { group = "net.kyori", name = "indra-git", version.ref = "indra" }
blossom = { group = "net.kyori", name = "blossom", version.ref = "blossom" }

methanol = { group = "com.github.mizosoft.methanol", name = "methanol", version.ref = "methanol" }

minecraftauth = { group = "net.raphimc", name = "MinecraftAuth", version.ref = "minecraftauth" }

sqlite = { group = "org.xerial", name = "sqlite-jdbc", version.ref = "sqlite" }

[bundles]
geyser = [
    "geyser-api",
    "geyser-core"
]
protocol = [
    "protocol-common",
    "protocol-codec",
    "protocol-connection"
]

[plugins]
shadow = { id = "com.gradleup.shadow", version.ref = "shadow" }
indra-git = { id = "net.kyori.indra.git", version.ref = "indra" }
blossom = { id = "net.kyori.blossom", version.ref = "blossom" }
